<script>

const cv=$('#cv'),g=cv.getContext('2d'),ED=$('#ed'),FX=$('#fx'),NB=$('#nb');
/* ---------- storage ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('jaosheets',1);r.onupgradeneeded=()=>r.result.createObjectStore('d',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

const put=d=>tx('readwrite',s=>s.put(d)),all=()=>tx('readonly',s=>s.getAll()),rm=id=>tx('readwrite',s=>s.delete(id));
function stat(t,bad){$('#st').textContent=t;$('#st').className=bad?'bad':'mu'}
function dirty(){doc.mod=Date.now();stat('Saving…');clearTimeout(tm);tm=setTimeout(async()=>{try{await put(doc);stat('✓ Saved')}catch(e){stat('⚠ Not saved',1)}},350)}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
/* ---------- values & formulas ---------- */
function pr(raw){const s=raw.trim();if(s==='')return null;if(/^(TRUE|FALSE)$/i.test(s))return s.toUpperCase()==='TRUE';if(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s))return +s;if(/^[-+]?\$?[\d,]*\d(\.\d+)?$/.test(s))return +s.replace(/[$,]/g,'');if(/^-?\d+(\.\d+)?%$/.test(s))return parseFloat(s)/100;const d=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s);if(d)return Date.UTC(+d[1],+d[2]-1,+d[3])/864e5+25569;return raw}
function show(v,nf){if(v==null)return'';if(v.e)return v.e;if(typeof v==='boolean')return v?'TRUE':'FALSE';if(typeof v!=='number')return String(v);if(!isFinite(v))return'#NUM!';
switch(nf){case'num':return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});case'dec':return v.toFixed(4);case'cur':return v.toLocaleString('en-US',{style:'currency',currency:'USD'});case'pct':return(v*100).toFixed(2)+'%';case'sci':return v.toExponential(2);
case'date':{const d=new Date(Math.round((v-25569)*864e5));return isNaN(d)?'#VALUE!':d.toISOString().slice(0,10)}
case'time':{const s=Math.round((v-Math.floor(v))*86400),p=n=>String(n).padStart(2,'0');return p(s/3600%24|0)+':'+p(s%3600/60|0)+':'+p(s%60)}}return String(+v.toPrecision(12))}
function tok(s){const t=[],re=/\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|"((?:[^"]|"")*)"|(\$?[A-Za-z]{1,3}\$?\d+)(?![\w(])|([A-Za-z_][\w.]*)|(<=|>=|<>|[-+*\/^&=<>(),:%]))/y;let m;while(re.lastIndex<s.length){const p=re.lastIndex;m=re.exec(s);if(!m){if(/^\s*$/.test(s.slice(p)))break;return null}
t.push(m[1]!=null?{n:+m[1]}:m[2]!=null?{s:m[2].replace(/""/g,'"')}:m[3]?{r:m[3]}:m[4]?{f:m[4].toUpperCase()}:{o:m[5]})}return t}
function ref(s){const m=/^\$?([A-Za-z]+)\$?(\d+)$/.exec(s),c=colNum(m[1].toUpperCase()),r=+m[2]-1;return c<0||c>=NC||r<0||r>=NR?null:[r,c]}
function rngV(a,b){const p=ref(a),q=ref(b);if(!p||!q)return ER('#REF!');const o=[];for(let r=Math.min(p[0],q[0]);r<=Math.max(p[0],q[0]);r++)for(let c=Math.min(p[1],q[1]);c<=Math.max(p[1],q[1]);c++)o.push(val(r,c));return{rg:o}}
function num(x){if(x==null)return 0;if(typeof x==='number')return x;if(x===true)return 1;if(x===false)return 0;if(x.e)return x;if(x.rg)return ER('#VALUE!');const n=x.trim()===''?0:+x;return isNaN(n)?ER('#VALUE!'):n}
function ar2(a,b,o){a=num(a);if(a.e)return a;b=num(b);if(b.e)return b;switch(o){case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':return b===0?ER('#DIV/0!'):a/b;default:{const p=Math.pow(a,b);return isFinite(p)?p:ER('#NUM!')}}}
function comp(a,b,o){if(a&&a.e)return a;if(b&&b.e)return b;if(a==null)a=typeof b==='string'?'':0;if(b==null)b=typeof a==='string'?'':0;const ty=x=>typeof x==='number'?0:typeof x==='string'?1:2;let d;
if(ty(a)!==ty(b))d=ty(a)-ty(b);else if(typeof a==='string'){a=a.toLowerCase();b=b.toLowerCase();d=a<b?-1:a>b?1:0}else d=a-b;return o==='='?d===0:o==='<>'?d!==0:o==='<'?d<0:o==='>'?d>0:o==='<='?d<=0:d>=0}
function tb(x){if(x==null)return false;if(x.e)return x;if(typeof x==='boolean')return x;if(typeof x==='number')return x!==0;if(typeof x==='string'){const u=x.toUpperCase();if(u==='TRUE')return true;if(u==='FALSE')return false}return ER('#VALUE!')}
const flat=a=>a.flatMap(x=>x&&x.rg?x.rg.filter(v=>v!=null):[x]);
function nums(a){const o=[];for(const x of a){if(x&&x.rg){for(const v of x.rg){if(v&&v.e)return v;if(typeof v==='number')o.push(v)}}else{if(x&&x.e)return x;const n=num(x);if(n.e)return n;o.push(n)}}return o}
function fn(n,a){const A=x=>Array.isArray(x);switch(n){
case'SUM':{const s=nums(a);return A(s)?s.reduce((x,y)=>x+y,0):s}
case'AVERAGE':{const s=nums(a);return A(s)?s.length?s.reduce((x,y)=>x+y,0)/s.length:ER('#DIV/0!'):s}
case'MIN':case'MAX':{const s=nums(a);return A(s)?s.length?Math[n.toLowerCase()](...s):0:s}
case'COUNT':{let k=0;for(const x of a)if(x&&x.rg)k+=x.rg.filter(v=>typeof v==='number').length;else if(typeof x==='number')k++;return k}
case'COUNTA':{let k=0;for(const x of a)if(x&&x.rg)k+=x.rg.filter(v=>v!=null&&v!=='').length;else if(x!=null)k++;return k}
case'IF':{const c=tb(a[0]);return c&&c.e?c:c?(a[1]==null?0:a[1]):a.length>2?a[2]:false}
case'AND':case'OR':{const b=flat(a).map(tb),e=b.find(x=>x&&x.e);if(e)return e;return n==='AND'?b.every(Boolean):b.some(Boolean)}
case'NOT':{const c=tb(a[0]);return c&&c.e?c:!c}
case'ROUND':case'ROUNDUP':case'ROUNDDOWN':{const x=num(a[0]),d=a.length>1?num(a[1]):0;if(x.e)return x;if(d.e)return d;const m=10**d,y=Math.abs(x)*m;return Math.sign(x)*(n==='ROUND'?Math.round(y+1e-9):n==='ROUNDUP'?Math.ceil(y-1e-9):Math.floor(y+1e-9))/m}

case'SQRT':{const x=num(a[0]);return x.e?x:x<0?ER('#NUM!'):Math.sqrt(x)}

return ER('#NAME?')}
function calc(src){const T=tok(src);if(!T)return ER('#NAME?');let i=0;const pk=()=>T[i],nx=()=>T[i++],isO=o=>pk()&&pk().o===o;
const cmp=()=>{let a=cat();while(pk()&&['=','<>','<','>','<=','>='].includes(pk().o)){const o=nx().o;a=comp(a,cat(),o)}return a};
const cat=()=>{let a=add();while(isO('&')){nx();const b=add();a=a&&a.e?a:b&&b.e?b:show(a,'')+show(b,'')}return a};
const add=()=>{let a=mul();while(isO('+')||isO('-')){const o=nx().o;a=ar2(a,mul(),o)}return a};
const mul=()=>{let a=pow();while(isO('*')||isO('/')){const o=nx().o;a=ar2(a,pow(),o)}return a};
const pow=()=>{let a=un();while(isO('^')){nx();a=ar2(a,un(),'^')}return a};

function prim(){const t=nx();if(!t)return ER('#VALUE!');if(t.n!=null)return t.n;if(t.s!=null)return t.s;

const v=cmp();return i<T.length?ER('#VALUE!'):v}

const shf=(f,dr,dc)=>f.replace(/(?<![\w.])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![\w(])/g,(m,a,c,b,r)=>{let ci=colNum(c.toUpperCase()),ri=+r-1;if(!a)ci+=dc;if(!b)ri+=dr;return ci<0||ri<0?'#REF!':a+colName(ci)+b+(ri+1)});

/* ---------- cells ---------- */
const gc=(r,c)=>S.cells[K(r,c)],rawv=(r,c)=>{const x=gc(r,c);return x&&x.v!=null?x.v:''},sc_=(r,c)=>S.cells[K(r,c)]||(S.cells[K(r,c)]={});

function setRaw(r,c,raw){const x=sc_(r,c);if(raw===''||raw==null)delete x.v;else{x.v=String(raw);const s=x.v.trim();if(s[0]!=='='&&!(x.f&&x.f.nf)){const nf=/^\d{4}-\d\d-\d\d$/.test(s)?'date':/^-?\$[\d,.]+$/.test(s)?'cur':/^-?[\d.]+%$/.test(s)?'pct':null;if(nf)x.f={...x.f,nf}}}tidy(r,c)}

const rg=()=>({r1:Math.min(ar,fr),r2:Math.max(ar,fr),c1:Math.min(ac,fc),c2:Math.max(ac,fc)});
const ns=n=>({name:n,cells:{},cw:{},rh:{},hid:{},charts:[],cf:[]});
/* ---------- mutation / undo ---------- */

/* ---------- geometry & drawing ---------- */
const fi=(a,x)=>{let l=0,h=a.length-2;while(l<h){const m=(l+h+1)>>1;if(a[m]<=x)l=m;else h=m-1}return l};
